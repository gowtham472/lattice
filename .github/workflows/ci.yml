# LATTICE continuous integration.
#
#   every push and pull request: format, lint, test (Rust), typecheck and build (cockpit),
#                                the OpenSSL golden scan, a short fuzz of every parser, and the
#                                Windows and macOS builds run on their own systems
#   nightly and on demand:       a long fuzz of every parser (corpora carried between runs)
#
# Third-party actions are pinned to commit SHAs (tags are movable); the Rust toolchain comes from
# rust-toolchain.toml. The workflow only reads the repository.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Seconds per fuzz target"
        default: "600"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Go test binaries for the tracer (unstripped and stripped)
        working-directory: crates/lattice-tracer/testdata/gocrypto
        run: |
          go build -o "$RUNNER_TEMP/gocrypto" .
          go build -ldflags="-s -w" -o "$RUNNER_TEMP/gocrypto-stripped" .
          echo "LATTICE_TEST_GO_BINARIES=$RUNNER_TEMP/gocrypto:$RUNNER_TEMP/gocrypto-stripped" >> "$GITHUB_ENV"
      - name: A rustls program on ring, unstripped, for the tracer
        run: |
          cargo build --release --locked --manifest-path crates/lattice-tracer/testdata/rustlsring/Cargo.toml --target-dir "$RUNNER_TEMP/rustlsring"
          echo "LATTICE_TEST_RING_BINARY=$RUNNER_TEMP/rustlsring/release/rustlsring" >> "$GITHUB_ENV"
      - name: JDK for the JVM tracer test (ML-KEM needs 24 or later)
        id: jdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - run: echo "LATTICE_TEST_JDK=${{ steps.jdk.outputs.path }}" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: What the sandbox enforces on this runner
        run: cargo run --locked -q -p lattice-cli -- sandbox-check

  cockpit:
    name: Cockpit (typecheck, build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  openssl-golden:
    name: OpenSSL golden scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-
      - name: OpenSSL release (downloaded once, checked against the pinned SHA-256)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/lattice-openssl/openssl-*.tar.gz
          key: openssl-${{ hashFiles('scripts/openssl-golden.py') }}
      - run: cargo build --release --locked -p lattice-cli
      - run: target/release/lattice sandbox-check
      - name: Compare with crates/lattice-engine/tests/golden/openssl-*.tsv
        run: python3 scripts/openssl-golden.py --lattice target/release/lattice --sandbox best-effort

  windows-build:
    name: Windows build (cross-compiled with zig)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain, zig and cargo-zigbuild
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/install-toolchain.sh
          rustup target add x86_64-pc-windows-gnu
      - name: lattice.exe, and the Linux CBOM of the demo estate to compare against
        run: |
          . scripts/dev-env.sh
          cargo zigbuild --release --locked --target x86_64-pc-windows-gnu -p lattice-cli
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/lattice.exe dist/
          SOURCE_DATE_EPOCH=1790121600 cargo run --release --locked -q -p lattice-cli --             --sandbox off scan examples/demo-estate -o dist/linux.cbom.json --report dist/linux.report.json --quiet
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist

  windows-run:
    name: Windows run (sandbox probes, identical CBOM)
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows
          path: dist
      - name: Version and sandbox probes
        shell: pwsh
        run: |
          ./dist/lattice.exe --version
          ./dist/lattice.exe sandbox-check
          ./dist/lattice.exe sandbox-check --json | Out-File -Encoding utf8 check.json
          if ($LASTEXITCODE -ne 0) { throw "a probe disagreed with the reported sandbox" }
          $check = Get-Content check.json -Raw | ConvertFrom-Json
          if (-not $check.sandbox.denies.execution) { throw "process mitigations did not deny child processes" }
      - name: The demo estate's CBOM and report are byte-identical to Linux's
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = "1790121600"
          ./dist/lattice.exe scan examples/demo-estate -o win.cbom.json --report win.report.json --quiet
          foreach ($pair in @(@("win.cbom.json", "dist/linux.cbom.json"), @("win.report.json", "dist/linux.report.json"))) {
            if ((Get-FileHash $pair[0]).Hash -ne (Get-FileHash $pair[1]).Hash) { throw "$($pair[0]) differs from $($pair[1])" }
          }

  macos:
    name: macOS (tests, binary)
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: macos-
      # includes the golden CBOM test: its file was written on Linux, so passing proves the
      # macOS build produces byte-identical output
      - run: cargo test --workspace --locked
      - name: What the sandbox reports on macOS
        run: cargo run --locked -q -p lattice-cli -- sandbox-check
      - run: cargo build --release --locked -p lattice-cli
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lattice-macos-arm64
          path: target/release/lattice

  fuzz:
    name: Fuzz every parser
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Corpora from earlier runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz (30 s per target on pushes, longer nightly or on demand)
        env:
          SECONDS_PER_TARGET: >-
            ${{ github.event_name == 'schedule' && '900'
             || github.event_name == 'workflow_dispatch' && inputs.fuzz_seconds
             || '30' }}
        run: python3 scripts/fuzz.py -t "$SECONDS_PER_TARGET"
      - name: Crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
