[package]
name = "lattice-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Process confinement for LATTICE: Landlock filesystem rules and a seccomp syscall filter"

[dependencies]
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
libc.workspace = true
rustix.workspace = true
seccompiler.workspace = true

# The workspace forbids unsafe code; this crate denies it instead, so the one Windows module
# that calls SetProcessMitigationPolicy can allow it locally (see src/lib.rs).
[lints.rust]
unsafe_code = "deny"
