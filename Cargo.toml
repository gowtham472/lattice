[workspace]
members = [
    "crates/lattice-core",
    "crates/lattice-engine",
    "crates/lattice-risk",
    "crates/lattice-classify",
    "crates/lattice-graph",
    "crates/lattice-collectors",
    "crates/lattice-cbom",
    "crates/lattice-cli",
    "crates/lattice-server",
    "crates/lattice-sandbox",
    "crates/lattice-report",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
anyhow = "1.0.104"
x509-parser = "0.18.1"
sha2 = "0.10.9"
goblin = "0.10.7"
base64 = "0.22.1"
aho-corasick = "1.1.5"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
fips204 = "0.4.6"
flate2 = "1.1.10"
# no default features: never resolve schemas over the network
jsonschema = { version = "0.57.0", default-features = false }
hex = "0.4.3"
landlock = "0.4.7"
libc = "0.2"
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "thread"] }
petgraph = "0.8.3"
proptest = "1.11.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
seccompiler = "0.5.0"
serde_json = "1.0.151"
thiserror = "2.0.20"
tempfile = "3.27.0"
toml = "1.1.6"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "limit", "trace"] }
http-body-util = "0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tree-sitter = "0.25.10"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# panic = "unwind" is load-bearing, never change it to "abort". Every collector parses
# hostile input inside `catch_unwind`, so a malformed file costs one artefact, not the scan
# (security.md §3). With "abort" that isolation silently disappears in release builds.
panic = "unwind"
codegen-units = 1
lto = "fat"
strip = "symbols"

[profile.dev.package."*"]
# Optimise dependencies in debug builds: tree-sitter parsing and ML-DSA are otherwise slow
# enough to distort test timings. Our own crates stay unoptimised and debuggable.
opt-level = 2
