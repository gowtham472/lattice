[workspace]
members = [
    "crates/lattice-core",
    "crates/lattice-risk",
    "crates/lattice-classify",
    "crates/lattice-graph",
    "crates/lattice-collectors",
    "crates/lattice-cbom",
    "crates/lattice-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fips204 = "0.4"
hex = "0.4"
petgraph = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.25"
tree-sitter-c = "0.24"
tree-sitter-java = "0.23"
tree-sitter-python = "0.25"
walkdir = "2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
