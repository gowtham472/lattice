languages = ["rust"]
callee = ["Rsa.generate"]
style = "primitive"
algorithm = "rsa"
param = [{ name = "key-bits", arg = 0, grammar = "int" }]

[[rule]]
id = "rust.ring.algorithm-constant"
languages = ["rust"]
