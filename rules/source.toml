callee_regex = '(?:^|\.)(?P<name>Md5|Sha1|Sha224|Sha256|Sha384|Sha512|Sha3_256|Sha3_384|Sha3_512|Blake2b512|Blake2s256|Ripemd160|Sm3)\.(?:new|digest|new_with_prefix)$'
