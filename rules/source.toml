]

[[rule]]
id = "go.rsa-encrypt"
languages = ["go"]
callee = ["rsa.EncryptPKCS1v15", "rsa.DecryptPKCS1v15", "rsa.EncryptOAEP", "rsa.DecryptOAEP"]
style = "primitive"
