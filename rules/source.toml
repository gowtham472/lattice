  { name = "key-bits", arg = 0, grammar = "int" },
  { name = "curve", arg = 0, grammar = "curve", strip_prefix = ["ECCurve.NamedCurves."] },
]

[[rule]]
id = "csharp.constructor"
languages = ["csharp"]
callee_regex = '(?:^|\.)(?P<name>AesGcm|AesCcm|ChaCha20Poly1305|HMACSHA1|HMACSHA256|HMACSHA384|HMACSHA512|HMACMD5|RSACryptoServiceProvider|DSACryptoServiceProvider|TripleDESCryptoServiceProvider|DESCryptoServiceProvider|RC2CryptoServiceProvider|MD5CryptoServiceProvider|SHA1CryptoServiceProvider|SHA1Managed|SHA256Managed|RijndaelManaged|AesManaged|AesCryptoServiceProvider)$'
style = "primitive"
from = { capture = "name", grammar = "name", strip_suffix = ["CryptoServiceProvider", "Managed"] }
