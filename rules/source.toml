style = "provider"
from = { arg = 0, grammar = "name", strip_prefix = ["aead.", "digest.", "hmac.", "agreement.", "signature."] }

# =============================================================================================
# C# — .NET System.Security.Cryptography
# =============================================================================================

[[rule]]
id = "csharp.create"
languages = ["csharp"]
callee_regex = '(?:^|\.)(?P<name>Aes|AesGcm|AesCcm|ChaCha20Poly1305|DES|TripleDES|RC2|Rijndael|RSA|DSA|ECDsa|ECDiffieHellman|MD5|SHA1|SHA256|SHA384|SHA512|SHA3_256|SHA3_384|SHA3_512|HMACSHA1|HMACSHA256|HMACSHA384|HMACSHA512|HMACMD5)\.(?:Create|HashData|TryHashData)$'
style = "provider"
from = { capture = "name", grammar = "name" }
