# The constructor's default digest is SHA-1 when none is passed.
params = { digest = "sha-1" }
param = [
  { name = "digest", arg = 3, grammar = "digest", strip_prefix = ["HashAlgorithmName."] },
  { name = "digest", arg = 4, grammar = "digest", strip_prefix = ["HashAlgorithmName."] },
]

[[rule]]
id = "csharp.pqc"
languages = ["csharp"]
callee = ["MLKem.GenerateKey", "MLDsa.GenerateKey", "SlhDsa.GenerateKey"]
style = "provider"
from = { arg = 0, grammar = "name", strip_prefix = ["MLKemAlgorithm.", "MLDsaAlgorithm.", "SlhDsaAlgorithm."] }

[[rule]]
id = "csharp.cipher-mode"
languages = ["csharp"]
kind = "assign"
property = ["Mode"]
style = "provider"
param = [{ name = "mode", value = true, grammar = "mode", strip_prefix = ["CipherMode."] }]

[[rule]]
id = "csharp.key-size"
languages = ["csharp"]
kind = "assign"
property = ["KeySize"]
style = "provider"
param = [{ name = "key-bits", value = true, grammar = "int" }]

