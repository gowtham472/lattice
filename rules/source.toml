# LATTICE source rules: cryptographic APIs and how to read algorithms and parameters from calls.
#
# Every rule names the calls it matches (`callee` suffixes or a `callee_regex`), the API style
# (drives crypto-agility), where the algorithm comes from (`algorithm` fixed, or `from` an
# argument / keyword / object property / regex capture), and which parameters to extract.
# Grammars: name | jca-cipher | group | curve | mode | digest | int | padding | version.
# Rule ids are stable; bump `version` when a rule's meaning changes.

version = "2026.09.1"

# =============================================================================================
# Java — JCA / JCE
# =============================================================================================

[[rule]]
id = "java.jca.cipher"
languages = ["java"]
callee = ["Cipher.getInstance"]
style = "provider"
from = { arg = 0, grammar = "jca-cipher" }

[[rule]]
id = "java.jca.message-digest"
languages = ["java"]
callee = ["MessageDigest.getInstance"]
style = "provider"
function = "digest"
from = { arg = 0, grammar = "name" }

[[rule]]
id = "java.jca.signature"
languages = ["java"]
callee = ["Signature.getInstance"]
style = "provider"
primitive = "signature"
from = { arg = 0, grammar = "name" }

[[rule]]
id = "java.jca.key-pair-generator"
languages = ["java"]
callee = ["KeyPairGenerator.getInstance"]
style = "provider"
function = "keygen"
from = { arg = 0, grammar = "name" }

[[rule]]
id = "java.jca.key-generator"
languages = ["java"]
callee = ["KeyGenerator.getInstance"]
style = "provider"
function = "keygen"
from = { arg = 0, grammar = "name" }

[[rule]]
id = "java.jca.key-agreement"
languages = ["java"]
callee = ["KeyAgreement.getInstance"]
style = "provider"
primitive = "key-agree"
from = { arg = 0, grammar = "name" }

[[rule]]
id = "java.jca.key-factory"
languages = ["java"]
callee = ["KeyFactory.getInstance"]
style = "provider"
from = { arg = 0, grammar = "name" }

[[rule]]
id = "java.jca.mac"
languages = ["java"]
callee = ["Mac.getInstance"]
style = "provider"
function = "tag"
from = { arg = 0, grammar = "name" }

[[rule]]
id = "java.jca.secret-key-factory"
languages = ["java"]
callee = ["SecretKeyFactory.getInstance"]
style = "provider"
from = { arg = 0, grammar = "name" }

[[rule]]
id = "java.jca.kem"
languages = ["java"]
callee = ["KEM.getInstance"]
style = "provider"
from = { arg = 0, grammar = "name" }

[[rule]]
id = "java.jca.secret-key-spec"
languages = ["java"]
callee = ["SecretKeySpec"]
style = "provider"
from = { arg = 1, grammar = "name" }

[[rule]]
id = "java.jca.rsa-keygen-spec"
languages = ["java"]
callee = ["RSAKeyGenParameterSpec"]
style = "provider"
algorithm = "rsa"
param = [{ name = "key-bits", arg = 0, grammar = "int" }]

[[rule]]
id = "java.jca.initialize"
languages = ["java"]
callee = ["*.initialize", "*.init"]
style = "provider"
kind = "refine"
param = [
  { name = "key-bits", arg = 0, grammar = "int" },
  { name = "curve", arg = 0, grammar = "curve" },
]

[[rule]]
id = "java.jsse.ssl-context"
languages = ["java"]
callee = ["SSLContext.getInstance"]
style = "protocol"
kind = "protocol-version"
from = { arg = 0, grammar = "version" }

[[rule]]
id = "java.jsse.enabled-protocols"
languages = ["java"]
callee = ["*.setEnabledProtocols"]
style = "protocol"
kind = "protocol-version"
from = { arg = 0, grammar = "version" }

[[rule]]
id = "java.jsse.enabled-cipher-suites"
languages = ["java"]
callee = ["*.setEnabledCipherSuites"]
style = "protocol"
kind = "cipher-list"
from = { arg = 0 }

# Bouncy Castle lightweight API: `new AESEngine()`, `new SHA1Digest()`, `new RSAEngine()`
[[rule]]
id = "java.bouncycastle.engine"
languages = ["java"]
callee_regex = '(?:^|\.)(?P<name>AES|DES|DESede|Blowfish|RC4|RC2|Twofish|Camellia|ARIA|SM4|Serpent|CAST5|IDEA|SEED|ChaCha|ChaCha7539|RSA|ElGamal)(?:Fast)?Engine$'
style = "primitive"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "java.bouncycastle.digest"
languages = ["java"]
callee_regex = '(?:^|\.)(?P<name>MD5|MD4|SHA1|SHA224|SHA256|SHA384|SHA512|SHA3|SM3|RIPEMD160|Blake2b|Blake2s|Blake3|Keccak)Digest$'
style = "primitive"
function = "digest"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "java.bouncycastle.pqc"
languages = ["java"]
callee_regex = '(?:^|\.)(?P<name>MLKEM|MLDSA|SLHDSA|Falcon|Kyber|Dilithium|SPHINCSPlus)(?:KeyPairGenerator|Signer|KEMGenerator|KEMExtractor)$'
style = "primitive"
from = { capture = "name", grammar = "name" }

# =============================================================================================
# C / C++ — OpenSSL
# =============================================================================================

[[rule]]
id = "c.openssl.evp-cipher"
languages = ["c"]
callee_regex = '^EVP_(?P<name>(?:aes|aria|camellia|sm4|des|bf|cast5|rc2|rc4|idea|seed|chacha20)(?:_[a-z0-9]+)*)$'
style = "provider"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "c.openssl.evp-digest"
languages = ["c"]
callee_regex = '^EVP_(?P<name>md4|md5|sha1|sha224|sha256|sha384|sha512|sha512_224|sha512_256|sha3_224|sha3_256|sha3_384|sha3_512|shake128|shake256|sm3|ripemd160|blake2b512|blake2s256)$'
style = "provider"
function = "digest"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "c.openssl.by-name"
languages = ["c"]
callee = ["EVP_get_cipherbyname", "EVP_get_digestbyname"]
style = "provider"
from = { arg = 0, grammar = "name" }

[[rule]]
id = "c.openssl3.fetch"
languages = ["c"]
callee = ["EVP_CIPHER_fetch", "EVP_MD_fetch", "EVP_MAC_fetch", "EVP_KDF_fetch", "EVP_SIGNATURE_fetch", "EVP_KEM_fetch", "EVP_KEYEXCH_fetch", "EVP_ASYM_CIPHER_fetch"]
style = "provider"
from = { arg = 1, grammar = "name" }

[[rule]]
id = "c.openssl3.pkey-from-name"
languages = ["c"]
callee = ["EVP_PKEY_CTX_new_from_name", "EVP_PKEY_Q_keygen"]
style = "provider"
function = "keygen"
from = { arg = 2, grammar = "name" }
param = [
  { name = "key-bits", arg = 3, grammar = "int" },
  { name = "curve", arg = 3, grammar = "curve" },
]

[[rule]]
id = "c.openssl.pkey-ctx-id"
languages = ["c"]
callee = ["EVP_PKEY_CTX_new_id"]
style = "provider"
from = { arg = 0, grammar = "name", strip_prefix = ["EVP_PKEY_"] }

[[rule]]
id = "c.openssl.pkey-keygen-bits"
languages = ["c"]
callee = ["EVP_PKEY_CTX_set_rsa_keygen_bits", "EVP_PKEY_CTX_set_dsa_paramgen_bits", "EVP_PKEY_CTX_set_dh_paramgen_prime_len"]
style = "provider"
kind = "refine"
receiver_arg = 0
param = [{ name = "key-bits", arg = 1, grammar = "int" }]

[[rule]]
id = "c.openssl.pkey-curve"
languages = ["c"]
callee = ["EVP_PKEY_CTX_set_ec_paramgen_curve_nid"]
style = "provider"
kind = "refine"
receiver_arg = 0
param = [{ name = "curve", arg = 1, grammar = "curve", strip_prefix = ["NID_X9_62_", "NID_"] }]

[[rule]]
id = "c.openssl.rsa-generate"
languages = ["c"]
callee = ["RSA_generate_key"]
style = "primitive"
algorithm = "rsa"
function = "keygen"
param = [{ name = "key-bits", arg = 0, grammar = "int" }]

[[rule]]
id = "c.openssl.rsa-generate-ex"
languages = ["c"]
callee = ["RSA_generate_key_ex", "RSA_generate_multi_prime_key"]
style = "primitive"
algorithm = "rsa"
function = "keygen"
param = [{ name = "key-bits", arg = 1, grammar = "int" }]

[[rule]]
id = "c.openssl.rsa-primitive"
languages = ["c"]
callee = ["RSA_new", "RSA_public_encrypt", "RSA_private_decrypt", "RSA_private_encrypt", "RSA_public_decrypt", "RSA_sign", "RSA_verify", "RSA_padding_add_PKCS1_type_2"]
style = "primitive"
algorithm = "rsa"

[[rule]]
id = "c.openssl.dsa"
languages = ["c"]
callee = ["DSA_generate_parameters_ex"]
style = "primitive"
algorithm = "dsa"
param = [{ name = "key-bits", arg = 1, grammar = "int" }]

[[rule]]
id = "c.openssl.dsa-primitive"
languages = ["c"]
callee = ["DSA_new", "DSA_sign", "DSA_verify", "DSA_do_sign", "DSA_do_verify"]
style = "primitive"
algorithm = "dsa"

[[rule]]
id = "c.openssl.dh"
languages = ["c"]
callee = ["DH_generate_parameters_ex"]
style = "primitive"
algorithm = "dh"
param = [{ name = "key-bits", arg = 1, grammar = "int" }]

[[rule]]
id = "c.openssl.dh-primitive"
languages = ["c"]
callee = ["DH_new", "DH_generate_key", "DH_compute_key", "DH_get_2048_256", "DH_get_1024_160"]
style = "primitive"
algorithm = "dh"

[[rule]]
id = "c.openssl.ec-key-curve"
languages = ["c"]
callee = ["EC_KEY_new_by_curve_name", "EC_GROUP_new_by_curve_name"]
style = "primitive"
algorithm = "ecdsa"
param = [{ name = "curve", arg = 0, grammar = "curve", strip_prefix = ["NID_X9_62_", "NID_"] }]

[[rule]]
id = "c.openssl.ecdsa"
languages = ["c"]
callee = ["ECDSA_sign", "ECDSA_verify", "ECDSA_do_sign", "ECDSA_do_verify"]
style = "primitive"
algorithm = "ecdsa"
primitive = "signature"

[[rule]]
id = "c.openssl.ecdh"
languages = ["c"]
callee = ["ECDH_compute_key"]
style = "primitive"
algorithm = "ecdh"

[[rule]]
id = "c.openssl.aes-lowlevel"
languages = ["c"]
callee = ["AES_set_encrypt_key", "AES_set_decrypt_key"]
style = "primitive"
algorithm = "aes"
param = [{ name = "key-bits", arg = 1, grammar = "int" }]

[[rule]]
id = "c.openssl.aes-lowlevel-mode"
languages = ["c"]
callee_regex = '^AES_(?P<mode>ecb|cbc|cfb128|cfb8|cfb1|ofb128|ctr128|ige|wrap|unwrap)_(?:encrypt|key)$'
style = "primitive"
algorithm = "aes"
param = [{ name = "mode", capture = "mode", grammar = "mode" }]

[[rule]]
id = "c.openssl.des-lowlevel"
languages = ["c"]
callee_regex = '^DES_(?:set_key|set_key_checked|set_key_unchecked|ecb_encrypt|ncbc_encrypt|cbc_encrypt|key_sched)$'
style = "primitive"
algorithm = "des"

[[rule]]
id = "c.openssl.3des-lowlevel"
languages = ["c"]
callee_regex = '^DES_ede3_(?:cbc_encrypt|ecb_encrypt|cfb64_encrypt|ofb64_encrypt)$'
style = "primitive"
algorithm = "3des"

[[rule]]
id = "c.openssl.digest-lowlevel"
languages = ["c"]
callee_regex = '^(?P<name>MD4|MD5|SHA1|SHA224|SHA256|SHA384|SHA512|RIPEMD160)(?:_Init|_Update|_Final)?$'
style = "primitive"
function = "digest"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "c.openssl.stream-lowlevel"
languages = ["c"]
callee_regex = '^(?P<name>RC4|BF|RC2|CAST|IDEA)_(?:set_key|encrypt|ecb_encrypt|cbc_encrypt)$'
style = "primitive"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "c.openssl.hmac-init"
languages = ["c"]
callee = ["HMAC_Init_ex"]
style = "primitive"
algorithm = "hmac"
# HMAC_Init_ex(ctx, key, key_len, md, impl)
param = [{ name = "digest", arg = 3, grammar = "digest", strip_prefix = ["EVP_"] }]

[[rule]]
id = "c.openssl.hmac-oneshot"
languages = ["c"]
# HMAC(md, key, key_len, data, data_len, out, out_len)
callee = ["HMAC"]
style = "primitive"
algorithm = "hmac"
param = [{ name = "digest", arg = 0, grammar = "digest", strip_prefix = ["EVP_"] }]

[[rule]]
id = "c.openssl.pbkdf2"
languages = ["c"]
callee = ["PKCS5_PBKDF2_HMAC"]
style = "primitive"
algorithm = "pbkdf2"
param = [{ name = "digest", arg = 5, grammar = "digest", strip_prefix = ["EVP_"] }]

[[rule]]
id = "c.openssl.pbkdf2-sha1"
languages = ["c"]
callee = ["PKCS5_PBKDF2_HMAC_SHA1"]
style = "primitive"
algorithm = "pbkdf2"
params = { digest = "sha-1" }

[[rule]]
id = "c.openssl.ssl-method"
languages = ["c"]
callee_regex = '^(?P<version>SSLv2|SSLv3|TLSv1|TLSv1_1|TLSv1_2|DTLSv1|DTLSv1_2)_(?:client_|server_)?method$'
style = "protocol"
kind = "protocol-version"
from = { capture = "version", grammar = "version" }

[[rule]]
id = "c.openssl.proto-version"
languages = ["c"]
callee = ["SSL_CTX_set_min_proto_version", "SSL_set_min_proto_version", "SSL_CTX_set_max_proto_version"]
style = "protocol"
kind = "protocol-version"
from = { arg = 1, grammar = "version" }

[[rule]]
id = "c.openssl.cipher-list"
languages = ["c"]
callee = ["SSL_CTX_set_cipher_list", "SSL_set_cipher_list", "SSL_CTX_set_ciphersuites", "SSL_set_ciphersuites"]
style = "protocol"
kind = "cipher-list"
from = { arg = 1 }

[[rule]]
id = "c.openssl.groups"
languages = ["c"]
callee = ["SSL_CTX_set1_groups_list", "SSL_set1_groups_list", "SSL_CTX_set1_curves_list", "SSL_set1_curves_list"]
style = "protocol"
kind = "group-list"
from = { arg = 1 }

# ---------------------------------------------------------------------------------------------
# C / C++ — libsodium, mbedTLS, Windows CNG
# ---------------------------------------------------------------------------------------------

[[rule]]
id = "c.sodium.box"
languages = ["c"]
callee_regex = '^crypto_(?:box|kx|scalarmult)(?:_[a-z0-9]+)*$'
style = "primitive"
algorithm = "x25519"

[[rule]]
id = "c.sodium.sign"
languages = ["c"]
callee_regex = '^crypto_sign(?:_[a-z0-9]+)*$'
style = "primitive"
algorithm = "ed25519"

[[rule]]
id = "c.sodium.aes-gcm"
languages = ["c"]
callee_regex = '^crypto_aead_aes256gcm_[a-z_]+$'
style = "primitive"
algorithm = "aes"
params = { keyBits = 256, mode = "gcm" }

[[rule]]
id = "c.sodium.chacha"
languages = ["c"]
callee_regex = '^crypto_aead_x?chacha20poly1305_(?:ietf_)?[a-z_]+$'
style = "primitive"
algorithm = "chacha20-poly1305"

[[rule]]
id = "c.sodium.generichash"
languages = ["c"]
callee_regex = '^crypto_generichash(?:_[a-z0-9]+)*$'
style = "primitive"
algorithm = "blake2b"

[[rule]]
id = "c.sodium.pwhash"
languages = ["c"]
callee_regex = '^crypto_pwhash(?:_str)?(?:_verify)?$'
style = "primitive"
algorithm = "argon2"

[[rule]]
id = "c.mbedtls.aes"
languages = ["c"]
callee = ["mbedtls_aes_setkey_enc", "mbedtls_aes_setkey_dec"]
style = "primitive"
algorithm = "aes"
param = [{ name = "key-bits", arg = 2, grammar = "int" }]

[[rule]]
id = "c.mbedtls.rsa-gen"
languages = ["c"]
callee = ["mbedtls_rsa_gen_key"]
style = "primitive"
algorithm = "rsa"
function = "keygen"
param = [{ name = "key-bits", arg = 3, grammar = "int" }]

[[rule]]
id = "c.mbedtls.ecp"
languages = ["c"]
callee = ["mbedtls_ecp_group_load"]
style = "primitive"
algorithm = "ecdsa"
param = [{ name = "curve", arg = 1, grammar = "curve", strip_prefix = ["MBEDTLS_ECP_DP_"] }]

[[rule]]
id = "c.mbedtls.digest"
languages = ["c"]
callee_regex = '^mbedtls_(?P<name>md5|sha1|sha256|sha512)(?:_ret|_starts|_update|_finish)?$'
style = "primitive"
function = "digest"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "c.cng.provider"
languages = ["c"]
callee = ["BCryptOpenAlgorithmProvider"]
style = "provider"
from = { arg = 1, grammar = "name", strip_prefix = ["BCRYPT_"], strip_suffix = ["_ALGORITHM"] }

# =============================================================================================
# Python — hashlib, hmac, cryptography, PyCryptodome, PyJWT, ssl
# =============================================================================================

[[rule]]
id = "python.hashlib.named"
languages = ["python"]
callee_regex = '^hashlib\.(?P<name>md5|sha1|sha224|sha256|sha384|sha512|sha3_224|sha3_256|sha3_384|sha3_512|shake_128|shake_256|blake2b|blake2s)$'
style = "primitive"
function = "digest"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "python.hashlib.new"
languages = ["python"]
callee = ["hashlib.new"]
style = "provider"
function = "digest"
from = { arg = 0, grammar = "name" }

[[rule]]
id = "python.hashlib.pbkdf2"
languages = ["python"]
callee = ["hashlib.pbkdf2_hmac"]
style = "provider"
algorithm = "pbkdf2"
param = [{ name = "digest", arg = 0, grammar = "digest" }]

[[rule]]
id = "python.hmac"
languages = ["python"]
callee = ["hmac.new", "hmac.digest"]
style = "provider"
algorithm = "hmac"
param = [
  { name = "digest", arg = 2, grammar = "digest" },
  { name = "digest", keyword = "digestmod", grammar = "digest" },
]

[[rule]]
id = "python.cryptography.rsa-generate"
languages = ["python"]
callee = ["rsa.generate_private_key"]
style = "primitive"
algorithm = "rsa"
function = "keygen"
param = [
  { name = "key-bits", keyword = "key_size", grammar = "int" },
  { name = "key-bits", arg = 1, grammar = "int" },
]

[[rule]]
id = "python.cryptography.dsa-generate"
languages = ["python"]
callee = ["dsa.generate_private_key"]
style = "primitive"
algorithm = "dsa"
param = [
  { name = "key-bits", keyword = "key_size", grammar = "int" },
  { name = "key-bits", arg = 0, grammar = "int" },
]

[[rule]]
id = "python.cryptography.dh-generate"
languages = ["python"]
callee = ["dh.generate_parameters"]
style = "primitive"
algorithm = "dh"
param = [
  { name = "key-bits", keyword = "key_size", grammar = "int" },
  { name = "key-bits", arg = 1, grammar = "int" },
]

[[rule]]
id = "python.cryptography.ec-generate"
languages = ["python"]
callee = ["ec.generate_private_key", "ec.derive_private_key"]
style = "primitive"
algorithm = "ecdsa"
function = "keygen"
param = [
  { name = "curve", arg = 0, grammar = "curve" },
  { name = "curve", keyword = "curve", grammar = "curve" },
  { name = "curve", arg = 1, grammar = "curve" },
]

[[rule]]
id = "python.cryptography.ecdh"
languages = ["python"]
callee = ["ec.ECDH"]
style = "primitive"
algorithm = "ecdh"

[[rule]]
id = "python.cryptography.ed25519"
languages = ["python"]
callee_regex = '(?:^|\.)(?P<name>Ed25519|Ed448|X25519|X448)PrivateKey\.(?:generate|from_private_bytes)$'
style = "primitive"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "python.cryptography.cipher"
languages = ["python"]
callee = ["Cipher"]
style = "provider"
from = { arg = 0, grammar = "name", strip_prefix = ["algorithms."] }
param = [{ name = "mode", arg = 1, grammar = "mode", strip_prefix = ["modes."] }]

[[rule]]
id = "python.cryptography.aead"
languages = ["python"]
callee_regex = '(?:^|\.)(?P<name>AESGCM|AESGCMSIV|AESCCM|AESOCB3|AESSIV|ChaCha20Poly1305)$'
style = "primitive"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "python.cryptography.hashes"
languages = ["python"]
callee_regex = '^hashes\.(?P<name>MD5|SHA1|SHA224|SHA256|SHA384|SHA512|SHA512_256|SHA3_256|SHA3_384|SHA3_512|SHAKE128|SHAKE256|BLAKE2b|BLAKE2s|SM3)$'
style = "primitive"
function = "digest"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "python.cryptography.pbkdf2"
languages = ["python"]
callee = ["PBKDF2HMAC"]
style = "primitive"
algorithm = "pbkdf2"
param = [{ name = "digest", keyword = "algorithm", grammar = "digest", strip_prefix = ["hashes."] }]

[[rule]]
id = "python.cryptography.hkdf"
languages = ["python"]
callee = ["HKDF", "HKDFExpand"]
style = "primitive"
algorithm = "hkdf"
param = [{ name = "digest", keyword = "algorithm", grammar = "digest", strip_prefix = ["hashes."] }]

[[rule]]
id = "python.cryptography.fernet"
languages = ["python"]
callee = ["Fernet", "MultiFernet"]
style = "primitive"
# Fernet is fixed by its specification: AES-128-CBC with HMAC-SHA256.
algorithms = ["aes", "hmac"]
params = { keyBits = 128, mode = "cbc", digest = "sha-256" }

[[rule]]
id = "python.pycryptodome.new"
languages = ["python"]
callee_regex = '(?:^|\.)(?P<name>AES|DES|DES3|ARC4|ARC2|Blowfish|CAST|ChaCha20|ChaCha20_Poly1305|Salsa20)\.new$'
style = "primitive"
from = { capture = "name", grammar = "name" }
param = [{ name = "mode", arg = 1, grammar = "mode", strip_prefix = ["AES.MODE_", "DES.MODE_", "DES3.MODE_", "Blowfish.MODE_", "MODE_"] }]

[[rule]]
id = "python.pycryptodome.hash"
languages = ["python"]
callee_regex = '(?:^|\.)(?P<name>MD5|MD4|SHA1|SHA224|SHA256|SHA384|SHA512|SHA3_256|SHA3_512|RIPEMD160|BLAKE2b|BLAKE2s)\.new$'
style = "primitive"
function = "digest"
from = { capture = "name", grammar = "name" }

[[rule]]
id = "python.pycryptodome.rsa"
languages = ["python"]
callee = ["RSA.generate"]
style = "primitive"
algorithm = "rsa"
param = [{ name = "key-bits", arg = 0, grammar = "int" }]

[[rule]]
id = "python.pycryptodome.ecc"
languages = ["python"]
callee = ["ECC.generate"]
style = "primitive"
algorithm = "ecdsa"
param = [{ name = "curve", keyword = "curve", grammar = "curve" }]

[[rule]]
id = "python.jwt"
languages = ["python"]
callee = ["jwt.encode", "jwt.decode"]
style = "protocol"
from = { keyword = "algorithm", grammar = "name" }

[[rule]]
id = "python.jwt.algorithms"
languages = ["python"]
callee = ["jwt.decode"]
style = "protocol"
from = { keyword = "algorithms", grammar = "name" }

[[rule]]
id = "python.ssl.context"
languages = ["python"]
callee = ["ssl.SSLContext", "ssl.wrap_socket"]
style = "protocol"
kind = "protocol-version"
from = { arg = 0, grammar = "version" }

[[rule]]
