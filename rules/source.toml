languages = ["go"]
callee_regex = '^ecdh\.(?P<curve>P256|P384|P521|X25519)$'
style = "primitive"
from = { capture = "curve", grammar = "group" }

[[rule]]
id = "go.ed25519"
languages = ["go"]
callee = ["ed25519.GenerateKey", "ed25519.Sign", "ed25519.Verify", "ed25519.NewKeyFromSeed"]
style = "primitive"
algorithm = "ed25519"

[[rule]]
id = "go.mlkem"
languages = ["go"]
callee_regex = '^mlkem\.(?:GenerateKey|NewDecapsulationKey|NewEncapsulationKey)(?P<set>768|1024)$'
