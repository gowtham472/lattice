param = [{ name = "digest", arg = 0, grammar = "digest" }]

[[rule]]
id = "go.pbkdf2"
languages = ["go"]
callee = ["pbkdf2.Key"]
style = "primitive"
algorithm = "pbkdf2"
param = [
  { name = "digest", arg = 4, grammar = "digest" },
  { name = "digest", arg = 0, grammar = "digest" },
]

