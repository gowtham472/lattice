# LATTICE algorithm knowledge base.
#
# Every quantum and classical judgement LATTICE prints traces back to an entry in this file,
# so each field names its source. The file is embedded in the binary and versioned; a signed
# knowledge bundle can replace it without a rebuild (security.md §7).
#
# Field reference
#   id          canonical identifier used in reports and bom-refs (lowercase, stable)
#   name        display name
#   primitive   CycloneDX 1.6 cryptoProperties.algorithmProperties.primitive
#   functions   CycloneDX cryptoFunctions this algorithm performs
#   quantum     shor         broken outright by Shor's algorithm (factoring / discrete log)
#               grover       generic quantum search roughly halves the security exponent
#               post-quantum designed and standardised to resist known quantum attacks
#   classical   acceptable | legacy | disallowed | broken, judged today, independent of Q-day
#   security    how classical security strength (bits) is derived:
#               key-bits          equal to the key size (block/stream ciphers)
#               integer-factoring NIST SP 800-57 Pt1 Rev5 Table 2 on the modulus size (RSA, DH, DSA)
#               curve             from the named curve's strength (see [[curve]])
#               fixed             always `strength` bits
#               hash-output       half the digest size (collision resistance)
#               parameter-set     from the selected [[algorithm.parameter_set]]
#   min_key_bits  below this size the algorithm is disallowed (SP 800-131A Rev2)
#   weak_modes    modes that are unsafe regardless of key size

version = "2026.09.1"

# ---------------------------------------------------------------------------------------------
# Public-key algorithms broken by Shor's algorithm
# ---------------------------------------------------------------------------------------------

[[algorithm]]
id = "rsa"
name = "RSA"
family = "RSA"
primitive = "pke"
functions = ["encrypt", "decrypt", "sign", "verify", "keygen"]
quantum = "shor"
classical = "acceptable"
security = "integer-factoring"
min_key_bits = 2048
key_bits = [1024, 2048, 3072, 4096, 7680, 8192, 15360]
aliases = ["rsa", "rsaencryption", "rsassa", "rsaes", "rsa-oaep", "rsassa-pss", "rsa-pss", "rsassa-pkcs1-v1_5", "rsaes-pkcs1-v1_5"]
oids = ["1.2.840.113549.1.1.1", "1.2.840.113549.1.1.7", "1.2.840.113549.1.1.10"]
replacement = { signature = "ml-dsa-65", encryption = "x25519-mlkem768" }
standard = "RFC 8017"
note = "RSA below 2048 bits is disallowed by NIST SP 800-131A Rev2."

